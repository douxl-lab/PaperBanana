name: Python compatibility and RFS tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate open Agent Skills specification (canonical skill root)
        run: |
          python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          skills-ref validate skills/paperbanana
      - run: python -m pip check
      - run: python scripts/check_publication.py
      - run: python -m pytest -q
      - run: python -m ruff check --select E9,F63,F7,F82 agents utils rfs skill main.py app.py demo.py tests scripts/check_publication.py
      - run: python -m compileall -q agents utils rfs skill main.py app.py demo.py
      - run: python skill/run.py --help
      - run: python skill/exchange.py describe
